<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-label="Douglas Moura — Full-stack &amp; AI Engineer">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b0f1a"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#22d3ee">
        <animate attributeName="stop-color" values="#22d3ee;#a78bfa;#f472b6;#22d3ee" dur="8s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" stop-color="#a78bfa">
        <animate attributeName="stop-color" values="#a78bfa;#f472b6;#22d3ee;#a78bfa" dur="8s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>
    <radialGradient id="glow1" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#22d3ee" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#a78bfa" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#a78bfa" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#1f2937" stroke-width="1"/>
    </pattern>
    <clipPath id="frame"><rect width="1200" height="300" rx="20"/></clipPath>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="1200" height="300" fill="url(#bg)"/>
    <rect width="1200" height="300" fill="url(#grid)" opacity="0.6"/>

    <circle cx="180" cy="60" r="220" fill="url(#glow1)">
      <animate attributeName="cx" values="180;260;180" dur="12s" repeatCount="indefinite"/>
    </circle>
    <circle cx="1040" cy="260" r="240" fill="url(#glow2)">
      <animate attributeName="cy" values="260;200;260" dur="10s" repeatCount="indefinite"/>
    </circle>

    <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15" fill="#334155">
      <text x="860" y="70">const dev = {</text>
      <text x="880" y="94">stack: ["TS", "Python", "Go", "Rust"],</text>
      <text x="880" y="118">focus: "AI agents + produto",</text>
      <text x="880" y="142">base: "Osasco, SP 🇧🇷",</text>
      <text x="860" y="166">};</text>
    </g>

    <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
      <text x="80" y="128" font-size="64" font-weight="800" fill="#f8fafc" letter-spacing="-1">Douglas Moura</text>
      <rect x="82" y="150" width="120" height="5" rx="2.5" fill="url(#accent)">
        <animate attributeName="width" values="120;260;120" dur="6s" repeatCount="indefinite"/>
      </rect>
      <text x="80" y="200" font-size="26" font-weight="600" fill="url(#accent)">Full-stack &amp; AI Engineer</text>
      <text x="80" y="238" font-size="18" fill="#94a3b8">Construo produtos do backend ao app — e os agentes de IA que ajudam a construí-los.</text>
    </g>

    <g>
      <circle cx="1140" cy="40" r="5" fill="#22c55e">
        <animate attributeName="opacity" values="1;0.3;1" dur="2s" repeatCount="indefinite"/>
      </circle>
      <text x="1128" y="45" text-anchor="end" font-family="ui-monospace, Consolas, monospace" font-size="13" fill="#64748b">shipping</text>
    </g>
  </g>
</svg>
